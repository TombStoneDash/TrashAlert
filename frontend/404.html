<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page Not Found | TrashAlert</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --green: #22c55e; --border: rgba(255,255,255,0.08); }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; border-bottom: 1px solid var(--border); }
    .logo { font-size: 20px; font-weight: 800; color: #fff; text-decoration: none; } .logo span { color: var(--accent); }
    nav a.nl { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; margin-left: 24px; } nav a.nl:hover { color: #fff; }
    .error-page { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 64px 32px; }
    .error-page .code { font-size: 96px; font-weight: 800; color: #fff; line-height: 1; margin-bottom: 16px; }
    .error-page h1 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 12px; }
    .error-page p { font-size: 16px; color: var(--muted); margin-bottom: 32px; max-width: 440px; }
    .error-page .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .error-page a.btn { display: inline-block; padding: 12px 24px; border-radius: 10px; font-size: 15px; font-weight: 700; text-decoration: none; }
    .error-page a.btn-primary { background: var(--accent); color: #0f172a; } .error-page a.btn-primary:hover { background: #7dd3fc; }
    .error-page a.btn-outline { background: transparent; color: var(--accent); border: 2px solid var(--accent); } .error-page a.btn-outline:hover { background: rgba(56,189,248,0.1); }
    footer { text-align: center; padding: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
<nav>
  <a href="/" class="logo"><span>TrashAlert</span></a>
  <div><a href="/" class="nl">Home</a><a href="/map" class="nl">Map</a><a href="/pricing" class="nl">Pricing</a><a href="/for/property-managers" class="nl">For PMs</a><a href="/coverage" class="nl">Coverage</a><a href="/about" class="nl">About</a></div>
</nav>
<div class="error-page">
  <div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Try looking up your address or browsing the zone map.</p>
    <div class="links">
      <a href="/" class="btn btn-primary">Look up your address</a>
      <a href="/map" class="btn btn-outline">View zone map</a>
    </div>
  </div>
</div>
<footer>&copy; 2026 Tombstone Dash LLC</footer>
</body>
</html>
