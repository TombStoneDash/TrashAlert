<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrashAlert - Lookup Your Collection Days</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .search-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .search-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .api-url-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
        }

        .api-url-label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .results {
            display: none;
        }

        .results.visible {
            display: block;
        }

        .result-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .result-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .result-card.trash {
            border-left: 5px solid #22c55e;
        }

        .result-card.recycling {
            border-left: 5px solid #3b82f6;
        }

        .result-card.green-waste {
            border-left: 5px solid #84cc16;
        }

        .result-card-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .result-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .result-card-day {
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .source-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .source-badge.official {
            background: #dbeafe;
            color: #1e40af;
        }

        .source-badge.crowd-verified {
            background: #dcfce7;
            color: #166534;
        }

        .source-badge.crowd-unverified {
            background: #fef3c7;
            color: #92400e;
        }

        .source-badge.unknown {
            background: #f3f4f6;
            color: #6b7280;
        }

        .report-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .report-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .toggle-report-button {
            padding: 10px 20px;
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .toggle-report-button:hover {
            background: #d97706;
        }

        .report-form {
            display: none;
        }

        .report-form.visible {
            display: block;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }

        .form-select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .submit-report-button {
            padding: 12px 25px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-report-button:hover {
            background: #059669;
        }

        .submit-report-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-message {
            background: #d1fae5;
            border-left: 4px solid #10b981;
            color: #065f46;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .debug-panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .debug-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            cursor: pointer;
            user-select: none;
        }

        .debug-title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
        }

        .debug-toggle {
            font-size: 0.9rem;
            color: #667eea;
        }

        .debug-content {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow: auto;
        }

        .debug-content.collapsed {
            display: none;
        }

        .debug-json {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #333;
        }

        .error-message {
            background: #fee;
            border-left: 4px solid #f44;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.1rem;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .address-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .address-display h3 {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 5px;
        }

        .address-display p {
            color: #666;
            font-size: 0.95rem;
        }

        .info-text {
            font-size: 0.85rem;
            color: #666;
            margin-top: 10px;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .search-form {
                flex-direction: column;
            }

            .header h1 {
                font-size: 2rem;
            }

            .result-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗑️ TrashAlert</h1>
            <p>Find your trash and recycling collection days</p>
        </div>

        <div class="search-card">
            <form class="search-form" id="searchForm">
                <input
                    type="text"
                    class="search-input"
                    id="addressInput"
                    placeholder="Enter your address (e.g., 123 Main St, Brawley)"
                    required
                />
                <button type="submit" class="search-button" id="searchButton">
                    Look Up
                </button>
            </form>

            <div style="margin-top: 20px;">
                <label class="api-url-label" for="apiUrl">API Endpoint:</label>
                <input
                    type="text"
                    class="api-url-input"
                    id="apiUrl"
                    value="http://localhost:8000"
                    placeholder="http://localhost:8000"
                />
                <p class="info-text">Base API URL (without /lookup or /report)</p>
            </div>
        </div>

        <div class="results" id="results">
            <div id="errorContainer"></div>
            <div id="loadingContainer"></div>
            <div id="addressContainer"></div>
            <div class="result-cards" id="resultCards"></div>

            <!-- Report Wrong Info Section -->
            <div class="report-section" id="reportSection" style="display: none;">
                <div class="report-header">
                    <h3 class="report-title">Have different information?</h3>
                    <button type="button" class="toggle-report-button" id="toggleReportButton">
                        Report Wrong Info
                    </button>
                </div>

                <form class="report-form" id="reportForm">
                    <p style="margin-bottom: 15px; color: #666;">Help improve the data by reporting your actual collection days:</p>

                    <div class="form-group">
                        <label class="form-label" for="reportTrashDay">Trash Collection Day:</label>
                        <select class="form-select" id="reportTrashDay">
                            <option value="">-- No Change / Unknown --</option>
                            <option value="MON">Monday</option>
                            <option value="TUE">Tuesday</option>
                            <option value="WED">Wednesday</option>
                            <option value="THU">Thursday</option>
                            <option value="FRI">Friday</option>
                            <option value="SAT">Saturday</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reportRecyclingDay">Recycling Collection Day:</label>
                        <select class="form-select" id="reportRecyclingDay">
                            <option value="">-- No Change / Unknown --</option>
                            <option value="MON">Monday</option>
                            <option value="TUE">Tuesday</option>
                            <option value="WED">Wednesday</option>
                            <option value="THU">Thursday</option>
                            <option value="FRI">Friday</option>
                            <option value="SAT">Saturday</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="reportGreenDay">Green Waste Collection Day:</label>
                        <select class="form-select" id="reportGreenDay">
                            <option value="">-- No Change / Unknown --</option>
                            <option value="MON">Monday</option>
                            <option value="TUE">Tuesday</option>
                            <option value="WED">Wednesday</option>
                            <option value="THU">Thursday</option>
                            <option value="FRI">Friday</option>
                            <option value="SAT">Saturday</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-report-button" id="submitReportButton">
                        Submit Report
                    </button>

                    <div id="reportSuccessMessage"></div>
                </form>
            </div>

            <div class="debug-panel">
                <div class="debug-header" id="debugHeader">
                    <span class="debug-title">Debug Panel</span>
                    <span class="debug-toggle">▼ Show</span>
                </div>
                <div class="debug-content collapsed" id="debugContent">
                    <pre class="debug-json" id="debugJson"></pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const searchForm = document.getElementById('searchForm');
        const addressInput = document.getElementById('addressInput');
        const searchButton = document.getElementById('searchButton');
        const apiUrlInput = document.getElementById('apiUrl');
        const results = document.getElementById('results');
        const resultCards = document.getElementById('resultCards');
        const errorContainer = document.getElementById('errorContainer');
        const loadingContainer = document.getElementById('loadingContainer');
        const addressContainer = document.getElementById('addressContainer');
        const debugHeader = document.getElementById('debugHeader');
        const debugContent = document.getElementById('debugContent');
        const debugToggle = debugHeader.querySelector('.debug-toggle');
        const debugJson = document.getElementById('debugJson');

        // Report form elements
        const reportSection = document.getElementById('reportSection');
        const toggleReportButton = document.getElementById('toggleReportButton');
        const reportForm = document.getElementById('reportForm');
        const submitReportButton = document.getElementById('submitReportButton');
        const reportSuccessMessage = document.getElementById('reportSuccessMessage');
        const reportTrashDay = document.getElementById('reportTrashDay');
        const reportRecyclingDay = document.getElementById('reportRecyclingDay');
        const reportGreenDay = document.getElementById('reportGreenDay');

        // State
        let lastResponse = null;
        let debugCollapsed = true;
        let reportFormVisible = false;
        let currentAddress = null;

        // Debug panel toggle
        debugHeader.addEventListener('click', () => {
            debugCollapsed = !debugCollapsed;
            if (debugCollapsed) {
                debugContent.classList.add('collapsed');
                debugToggle.textContent = '▼ Show';
            } else {
                debugContent.classList.remove('collapsed');
                debugToggle.textContent = '▲ Hide';
            }
        });

        // Toggle report form
        toggleReportButton.addEventListener('click', () => {
            reportFormVisible = !reportFormVisible;
            if (reportFormVisible) {
                reportForm.classList.add('visible');
                toggleReportButton.textContent = 'Hide Form';
            } else {
                reportForm.classList.remove('visible');
                toggleReportButton.textContent = 'Report Wrong Info';
            }
        });

        // Form submission
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const address = addressInput.value.trim();
            if (!address) return;

            await lookupAddress(address);
        });

        // Report form submission
        reportForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentAddress) {
                showError('Please perform a lookup first before reporting.');
                return;
            }

            const trashDay = reportTrashDay.value || null;
            const recyclingDay = reportRecyclingDay.value || null;
            const greenDay = reportGreenDay.value || null;

            if (!trashDay && !recyclingDay && !greenDay) {
                alert('Please select at least one collection day to report.');
                return;
            }

            await submitReport(currentAddress, trashDay, recyclingDay, greenDay);
        });

        // Main lookup function
        async function lookupAddress(address) {
            // Show loading state
            showLoading();
            clearError();
            clearResults();
            reportSection.style.display = 'none';

            try {
                const apiUrl = apiUrlInput.value.trim().replace(/\/$/, ''); // Remove trailing slash
                const url = `${apiUrl}/lookup?address=${encodeURIComponent(address)}`;

                const response = await fetch(url);
                const data = await response.json();

                // Store response for debug panel
                lastResponse = {
                    endpoint: 'GET /lookup',
                    status: response.status,
                    statusText: response.statusText,
                    data: data
                };

                if (!response.ok) {
                    throw new Error(data.detail || data.error || `API error: ${response.status}`);
                }

                // Store current address for reporting
                currentAddress = address;

                // Display results
                displayResults(address, data);
                updateDebugPanel();

                // Show report section
                reportSection.style.display = 'block';

            } catch (error) {
                showError(error.message);
                lastResponse = { endpoint: 'GET /lookup', error: error.message };
                updateDebugPanel();
            } finally {
                hideLoading();
            }
        }

        // Submit report function
        async function submitReport(address, trashDay, recyclingDay, greenDay) {
            submitReportButton.disabled = true;
            submitReportButton.textContent = 'Submitting...';
            reportSuccessMessage.innerHTML = '';

            try {
                const apiUrl = apiUrlInput.value.trim().replace(/\/$/, '');
                const url = `${apiUrl}/report`;

                const body = {
                    address: address,
                    trash_day: trashDay,
                    recycling_day: recyclingDay,
                    green_day: greenDay,
                    user_hash: null  // Optional: could generate a stable hash from browser fingerprint
                };

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                // Store response for debug panel
                lastResponse = {
                    endpoint: 'POST /report',
                    status: response.status,
                    statusText: response.statusText,
                    request: body,
                    data: data
                };

                if (!response.ok) {
                    throw new Error(data.detail || data.error || `API error: ${response.status}`);
                }

                // Show success message
                reportSuccessMessage.innerHTML = `
                    <div class="success-message">
                        <strong>Thank you!</strong> Your report has been submitted successfully.
                        ${data.consensus ? ` Total reports for this address: ${data.consensus.reports_count}` : ''}
                    </div>
                `;

                // Reset form
                reportTrashDay.value = '';
                reportRecyclingDay.value = '';
                reportGreenDay.value = '';

                // Update debug panel
                updateDebugPanel();

                // Optionally refresh the lookup to show updated data
                setTimeout(() => {
                    lookupAddress(address);
                }, 1500);

            } catch (error) {
                reportSuccessMessage.innerHTML = `
                    <div class="error-message">
                        <strong>Error:</strong> ${escapeHtml(error.message)}
                    </div>
                `;
                lastResponse = { endpoint: 'POST /report', error: error.message };
                updateDebugPanel();
            } finally {
                submitReportButton.disabled = false;
                submitReportButton.textContent = 'Submit Report';
            }
        }

        // Display functions
        function displayResults(address, data) {
            results.classList.add('visible');

            // Show address
            addressContainer.innerHTML = `
                <div class="address-display">
                    <h3>Results for:</h3>
                    <p><strong>${escapeHtml(address)}</strong></p>
                    <p style="font-size: 0.85rem; margin-top: 5px;">Normalized: ${escapeHtml(data.normalized_address || address)}</p>
                </div>
            `;

            // Create result cards
            resultCards.innerHTML = '';

            // Determine source badge
            const sourceBadge = getSourceBadge(data.source);

            // Trash card
            if (data.trash_day) {
                resultCards.innerHTML += createResultCard(
                    'trash',
                    '🗑️',
                    'Trash Collection',
                    data.trash_day,
                    sourceBadge
                );
            }

            // Recycling card
            if (data.recycling_day) {
                resultCards.innerHTML += createResultCard(
                    'recycling',
                    '♻️',
                    'Recycling Collection',
                    data.recycling_day,
                    sourceBadge
                );
            }

            // Green waste card
            if (data.green_day) {
                resultCards.innerHTML += createResultCard(
                    'green-waste',
                    '🌿',
                    'Green Waste Collection',
                    data.green_day,
                    sourceBadge
                );
            }

            // Handle case where no days found
            if (!data.trash_day && !data.recycling_day && !data.green_day) {
                resultCards.innerHTML = `
                    <div class="result-card">
                        <div class="result-card-icon">❌</div>
                        <div class="result-card-title">No collection days found</div>
                        <p style="color: #666; margin-top: 10px;">
                            We don't have pickup schedule information for this address yet.
                            You can help by reporting your collection days below!
                        </p>
                        ${sourceBadge}
                    </div>
                `;
            }
        }

        function getSourceBadge(source) {
            const badges = {
                'OFFICIAL': '<span class="source-badge official">Official Data</span>',
                'CROWD_VERIFIED': '<span class="source-badge crowd-verified">Verified by Community</span>',
                'CROWD_UNVERIFIED': '<span class="source-badge crowd-unverified">Community Reported (Unverified)</span>',
                'UNKNOWN': '<span class="source-badge unknown">Source Unknown</span>'
            };
            return badges[source] || badges['UNKNOWN'];
        }

        function createResultCard(type, icon, title, day, sourceBadge) {
            return `
                <div class="result-card ${type}">
                    <div class="result-card-icon">${icon}</div>
                    <div class="result-card-title">${title}</div>
                    <div class="result-card-day">${escapeHtml(day)}</div>
                    ${sourceBadge}
                </div>
            `;
        }

        function showLoading() {
            loadingContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Looking up collection schedule...</div>
                </div>
            `;
            searchButton.disabled = true;
            searchButton.textContent = 'Loading...';
        }

        function hideLoading() {
            loadingContainer.innerHTML = '';
            searchButton.disabled = false;
            searchButton.textContent = 'Look Up';
        }

        function showError(message) {
            errorContainer.innerHTML = `
                <div class="error-message">
                    <strong>Error:</strong> ${escapeHtml(message)}
                </div>
            `;
            results.classList.add('visible');
        }

        function clearError() {
            errorContainer.innerHTML = '';
        }

        function clearResults() {
            resultCards.innerHTML = '';
            addressContainer.innerHTML = '';
            reportSuccessMessage.innerHTML = '';
        }

        function updateDebugPanel() {
            if (lastResponse) {
                debugJson.textContent = JSON.stringify(lastResponse, null, 2);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load API URL from localStorage
        const savedApiUrl = localStorage.getItem('apiUrl');
        if (savedApiUrl) {
            apiUrlInput.value = savedApiUrl;
        }

        // Save API URL to localStorage on change
        apiUrlInput.addEventListener('change', () => {
            localStorage.setItem('apiUrl', apiUrlInput.value);
        });
    </script>
</body>
</html>
