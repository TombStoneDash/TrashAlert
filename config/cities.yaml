# Processing configuration
processing:
  # API rate limits
  overpass_api:
    timeout_seconds: 180
    max_retries: 3
    rate_limit_delay: 2.0

  # Chunk size for large queries
  chunk_size: 1000

  # Output formats
  output_formats:
    - geojson
    - csv
    - json

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_dir: "logs"
  rotate: true
  max_bytes: 10485760  # 10MB
  backup_count: 5
