version: '3.8'

services:
  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trashalert-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Mount SQLite database directory as persistent volume
      - ./data:/app/data:rw
      # Mount logs directory
      - ./logs:/app/logs:rw
    networks:
      - trashalert-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Don't expose port directly - only through nginx
    expose:
      - "8000"

  # Worker Service for Scheduled Pipeline Tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trashalert-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Share same database and logs with API
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    networks:
      - trashalert-network
    # Run background job scheduler
    command: ["python", "worker.py"]
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.path.exists('/app/logs/cron.log') or exit(1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: trashalert-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Nginx configuration
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL certificates (Let's Encrypt)
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      # Nginx cache
      - nginx-cache:/var/cache/nginx
    networks:
      - trashalert-network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot:latest
    container_name: trashalert-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt:rw
      - ./certbot/www:/var/www/certbot:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - trashalert-network
    depends_on:
      - nginx

networks:
  trashalert-network:
    driver: bridge

volumes:
  nginx-cache:
    driver: local
