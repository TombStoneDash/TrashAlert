    <line x1="150" y1="280" x2="250" y2="280" stroke="#3B82F6" stroke-width="2"/>
    <line x1="155" y1="300" x2="245" y2="300" stroke="#3B82F6" stroke-width="2"/>
    <line x1="160" y1="320" x2="240" y2="320" stroke="#3B82F6" stroke-width="2"/>
    <line x1="170" y1="260" x2="170" y2="320" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="200" y1="255" x2="200" y2="325" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="225" y1="260" x2="225" y2="320" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Ocean Beach / Point Loma -->
    <line x1="140" y1="420" x2="230" y2="420" stroke="#3B82F6" stroke-width="2"/>
    <line x1="145" y1="440" x2="225" y2="440" stroke="#3B82F6" stroke-width="2.5"/>
    <line x1="150" y1="460" x2="220" y2="460" stroke="#3B82F6" stroke-width="2"/>
