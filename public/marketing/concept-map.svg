    <line x1="435" y1="120" x2="610" y2="120" stroke="#8B5CF6" stroke-width="2.5"/>
    <line x1="430" y1="140" x2="605" y2="140" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="440" y1="160" x2="600" y2="160" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="435" y1="180" x2="595" y2="180" stroke="#8B5CF6" stroke-width="2.5"/>
