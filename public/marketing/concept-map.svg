    <line x1="270" y1="280" x2="395" y2="280" stroke="#22C55E" stroke-width="2"/>
    <line x1="265" y1="300" x2="400" y2="300" stroke="#22C55E" stroke-width="2"/>
    <line x1="275" y1="320" x2="390" y2="320" stroke="#22C55E" stroke-width="1.5"/>
