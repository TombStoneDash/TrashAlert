    <line x1="400" y1="300" x2="530" y2="300" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="410" y1="320" x2="520" y2="320" stroke="#8B5CF6" stroke-width="2.5"/>
    <line x1="420" y1="340" x2="515" y2="340" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="425" y1="255" x2="425" y2="345" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="465" y1="260" x2="465" y2="340" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="500" y1="255" x2="500" y2="345" stroke="#8B5CF6" stroke-width="1.5"/>
    <!-- Tierrasanta -->
