    <line x1="265" y1="600" x2="375" y2="600" stroke="#F59E0B" stroke-width="2.5"/>
    <line x1="260" y1="620" x2="380" y2="620" stroke="#F59E0B" stroke-width="2"/>
    <line x1="280" y1="575" x2="280" y2="625" stroke="#F59E0B" stroke-width="1.5"/>
