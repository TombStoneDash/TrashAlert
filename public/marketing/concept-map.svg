  <g font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#e2e8f0">
    <rect x="910" y="258" width="20" height="20" rx="3" fill="#3B82F6"/>
    <text x="942" y="274">Monday</text>

    <rect x="910" y="298" width="20" height="20" rx="3" fill="#22C55E"/>
    <text x="942" y="314">Tuesday</text>

    <rect x="910" y="338" width="20" height="20" rx="3" fill="#F59E0B"/>
    <text x="942" y="354">Wednesday</text>

    <rect x="910" y="378" width="20" height="20" rx="3" fill="#8B5CF6"/>
    <text x="942" y="394">Thursday</text>

    <rect x="910" y="418" width="20" height="20" rx="3" fill="#EF4444"/>
