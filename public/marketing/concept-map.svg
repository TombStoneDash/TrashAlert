    <line x1="170" y1="140" x2="280" y2="140" stroke="#3B82F6" stroke-width="2.5"/>
    <line x1="160" y1="160" x2="290" y2="160" stroke="#3B82F6" stroke-width="2"/>
    <line x1="165" y1="180" x2="285" y2="180" stroke="#3B82F6" stroke-width="2"/>
    <line x1="175" y1="200" x2="275" y2="200" stroke="#3B82F6" stroke-width="2.5"/>
    <line x1="180" y1="140" x2="180" y2="200" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="210" y1="135" x2="210" y2="205" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="240" y1="140" x2="240" y2="200" stroke="#3B82F6" stroke-width="1.5"/>
    <line x1="265" y1="140" x2="265" y2="200" stroke="#3B82F6" stroke-width="1.5"/>
    <!-- Pacific Beach / Mission Beach streets -->
