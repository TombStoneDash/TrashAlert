    <line x1="495" y1="460" x2="645" y2="460" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="510" y1="395" x2="510" y2="465" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="550" y1="400" x2="550" y2="460" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="590" y1="395" x2="590" y2="465" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="630" y1="400" x2="630" y2="460" stroke="#EF4444" stroke-width="1.5"/>
    <!-- Encanto / Paradise Hills -->
