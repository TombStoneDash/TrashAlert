    <line x1="250" y1="440" x2="375" y2="440" stroke="#22C55E" stroke-width="2"/>
    <line x1="260" y1="395" x2="260" y2="445" stroke="#22C55E" stroke-width="1.5"/>
    <line x1="300" y1="400" x2="300" y2="440" stroke="#22C55E" stroke-width="1.5"/>
    <line x1="340" y1="395" x2="340" y2="445" stroke="#22C55E" stroke-width="1.5"/>
