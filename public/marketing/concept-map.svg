  <!-- === HEADER === -->
  <rect x="0" y="0" width="1200" height="60" fill="rgba(15,23,42,0.95)"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#334155" stroke-width="1.5"/>

  <text x="30" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#38bdf8">
    TrashAlert
  </text>
  <text x="185" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#e2e8f0">
    San Diego Collection Map
  </text>
  <text x="1170" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8" text-anchor="end">
    274,000+ addresses mapped
  </text>

  <!-- === FOOTER === -->
  <rect x="0" y="860" width="1200" height="40" fill="rgba(15,23,42,0.95)"/>
  <line x1="0" y1="860" x2="1200" y2="860" stroke="#334155" stroke-width="1"/>
  <text x="30" y="885" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#64748b">
