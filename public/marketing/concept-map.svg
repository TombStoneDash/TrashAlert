    <!-- I-15 (north-south inland) -->
    <path d="M 470 60 Q 460 200, 450 350 Q 440 500, 440 650" fill="none"/>
    <!-- I-805 -->
    <path d="M 380 120 Q 370 300, 360 500 Q 350 650, 340 780" fill="none"/>
    <!-- SR-163 -->
    <path d="M 310 230 Q 300 320, 290 430" fill="none" stroke-width="2"/>
    <!-- SR-52 -->
    <path d="M 270 240 Q 400 230, 550 230" fill="none" stroke-width="2"/>
    <!-- SR-56 -->
    <path d="M 250 180 Q 350 175, 430 170" fill="none" stroke-width="2"/>
  </g>

