    <line x1="355" y1="720" x2="525" y2="720" stroke="#EF4444" stroke-width="2.5"/>
    <line x1="350" y1="740" x2="530" y2="740" stroke="#EF4444" stroke-width="2"/>
    <line x1="360" y1="760" x2="520" y2="760" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="380" y1="695" x2="380" y2="765" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="420" y1="700" x2="420" y2="760" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="460" y1="695" x2="460" y2="765" stroke="#EF4444" stroke-width="1.5"/>
    <line x1="500" y1="700" x2="500" y2="760" stroke="#EF4444" stroke-width="1.5"/>
