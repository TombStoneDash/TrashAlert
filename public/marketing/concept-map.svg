    <line x1="545" y1="290" x2="645" y2="290" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="540" y1="310" x2="650" y2="310" stroke="#8B5CF6" stroke-width="2.5"/>
    <line x1="560" y1="265" x2="560" y2="315" stroke="#8B5CF6" stroke-width="1.5"/>
    <line x1="600" y1="270" x2="600" y2="310" stroke="#8B5CF6" stroke-width="1.5"/>
