<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <!-- Glow filter for streets -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="#0f172a"/>
  <rect width="1200" height="900" fill="url(#noise)" opacity="0.3"/>

  <!-- Water (Pacific Ocean / San Diego Bay) -->
  <path d="M 0 200 Q 80 180, 120 250 Q 150 320, 100 400 Q 80 480, 130 550
           Q 160 600, 140 680 Q 120 750, 150 800 L 150 900 L 0 900 Z"
        fill="#0c1929" stroke="#1e3a5f" stroke-width="0.5" opacity="0.8"/>
  <!-- Mission Bay -->
  <ellipse cx="175" cy="340" rx="35" ry="20" fill="#0c1929" stroke="#1e3a5f" stroke-width="0.5"/>
  <!-- San Diego Bay -->
  <path d="M 180 580 Q 200 620, 220 680 Q 240 740, 260 800 L 180 800 Z"
        fill="#0c1929" stroke="#1e3a5f" stroke-width="0.5"/>

  <!-- === COLLECTION DAY ZONES (street grids) === -->

